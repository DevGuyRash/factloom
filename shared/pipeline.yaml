# Single source of truth for pipeline numbers: scoring weights, follow-up timing, staleness
# thresholds, and pay normalization. Commands under tools/src/commands/ (app, score, pay, queue,
# dashboard, status) read this file through tools/src/lib/pipeline-config.ts instead of
# hardcoding these numbers. Change a number here and every command picks it up next run.

# `app submit` sets follow_up = applied + follow_up_days.
follow_up_days: 7

# `queue list` / `dashboard` / `status` call a queued item "stale" once it has waited this long
# (days since its `found` date) without being started or done.
stale_queue_days: 10

# `pay`: hours in a work-year, for normalizing an hourly pay_min/pay_max to annual.
hours_per_year: 2080

# `status` lists a resume guide for fresh market research once its `researched` date is this many
# days old, or when it has none, so each guide's targets keep up with the market.
guide_research_days: 90

# `run start` refuses while the newest run log still running was written to within this many minutes:
# another activation (a scheduled one that has not finished) is at work in the same browser and queue.
# `run start --takeover` starts anyway. A run log quiet for longer is closed as abandoned.
run_active_minutes: 15

score:
  # Weights for each dimension of a record's `fit:` map (see tools/src/lib/scoring.ts). A
  # dimension missing from `fit:` is left out of both the earned and possible totals, so the
  # score is renormalized over whatever the record actually states.
  weights:
    must_haves: 35
    pay_ok: 10
    arrangement_ok: 10
    location_ok: 10
    seniority: 20
    preferred: 15
  # Credit given for each `fit.seniority` value (match/stretch/over).
  seniority_credit:
    match: 1
    stretch: 0.6
    over: 0.5
  # The lowest score worth applying to when the person has not answered `prefs.min-fit` in
  # onboarding. `score` reports whether a posting clears the bar; postings below it are skipped.
  minimum: 65
  # Whatever the score, a posting is skipped when the person meets less than this share of its
  # must-haves: screening already settles pay, arrangement, and location, so those points come easy.
  must_haves_minimum: 0.5
